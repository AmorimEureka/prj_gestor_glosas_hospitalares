{% if pagination.total %}
<div class="pagination-control">
  {% if pagination.has_previous %}
  <a class="page-step" href="{{ pagination.previous_url }}">Anterior</a>
  {% else %}
  <span class="page-step page-step--disabled">Anterior</span>
  {% endif %}
  <form method="get" class="page-select-form">
    {% for key, value in pagination.query.items %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endfor %}
    <label for="{{ pagination_id }}">Pagina</label>
    <select
      id="{{ pagination_id }}"
      name="page"
      class="form-select form-select-sm"
      onchange="this.form.submit()"
    >
      {% for option in pagination.page_options %}
      <option value="{{ option.number }}" {% if option.selected %}selected{% endif %}>{{ option.number }}</option>
      {% endfor %}
    </select>
    <span>de {{ pagination.total_pages }}</span>
  </form>
  {% if pagination.has_next %}
  <a class="page-step" href="{{ pagination.next_url }}">Proxima</a>
  {% else %}
  <span class="page-step page-step--disabled">Proxima</span>
  {% endif %}
</div>
{% endif %}
